name: Fix broken TMDB block

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair escaped Python block
        shell: python
        run: |
          from pathlib import Path

          p = Path('app_backend.py')
          s = p.read_text(encoding='utf-8')

          start_marker = r'\\n\\n@app.get("/api/tmdb/search")'
          end_marker = r'\\n@app.get("/api/media/{mid}")'
          start = s.find(start_marker)
          end = s.find(end_marker, start + len(start_marker)) if start >= 0 else -1

          if start < 0 or end < 0:
              print('TMDB escaped block not found; nothing to repair.')
          else:
              block_end = end + len(end_marker)
              block = s[start:block_end]
              repaired = block.replace(r'\\n', '\n')
              s = s[:start] + repaired + s[block_end:]
              p.write_text(s, encoding='utf-8')
              print('TMDB block repaired.')

      - name: Validate Python syntax
        shell: python
        run: |
          import py_compile
          py_compile.compile('app_backend.py', doraise=True)
          print('app_backend.py syntax OK')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_backend.py
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Fix escaped TMDB scheduler Python block'
          git push
