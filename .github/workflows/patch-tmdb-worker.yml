name: Fix TMDB worker startup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tmdb-worker-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app.py
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '''async def startup():\n init_db()\n normalize_existing_titles()\n ensure_recovery_row()\n cleanup_playback_cache(None)\n stop_hls_playback()\n asyncio.create_task(engine())'''
          new = '''async def startup():\n global TMDB_TASK\n init_db()\n normalize_existing_titles()\n ensure_recovery_row()\n cleanup_playback_cache(None)\n stop_hls_playback()\n # TMDB worker must be started at application startup. Without this task,\n # /tmdb/run only sets an Event that no coroutine ever consumes, so no\n # search/download can occur.\n if TMDB_TASK is None or TMDB_TASK.done():\n  TMDB_TASK = asyncio.create_task(tmdb_worker())\n asyncio.create_task(engine())'''
          if old not in s:
              raise SystemExit('Expected startup block not found; refusing to modify app.py')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Fix TMDB worker startup [tmdb-worker-fixed]'
          git push
