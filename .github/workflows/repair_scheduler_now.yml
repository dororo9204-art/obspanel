name: Repair Scheduler Now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[scheduler-repaired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair literal escaped block
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          slash_n=chr(92)+'n'
          marker1=slash_n+slash_n+'@app.get("/api/tmdb/search")'
          marker2=slash_n+'@app.get("/api/media/{mid}")'
          start=s.find(marker1)
          end=s.find(marker2,start+1) if start >= 0 else -1
          if start >= 0 and end > start:
              block=s[start:end].replace(slash_n,'\n')
              s=s[:start]+block+s[end:]
              p.write_text(s,encoding='utf-8')
              print('Escaped scheduler block repaired')
          else:
              print('Escaped block not found; leaving source unchanged')
      - name: Validate
        run: python -m py_compile app.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m 'Repair Scheduler backend [scheduler-repaired]'
          git push origin main
