name: Fix Scheduler backend patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[scheduler-backend-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair generated endpoint block
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          start=s.find('\\n\\n@app.get("/api/tmdb/search")')
          end=s.find('\\n@app.get("/api/media/{mid}")', start+1) if start >= 0 else -1
          if start >= 0 and end > start:
              block=s[start:end]
              block=block.replace('\\n','\n')
              s=s[:start]+block+s[end:]
              p.write_text(s,encoding='utf-8')
              print('Scheduler endpoint block repaired')
          else:
              print('No escaped endpoint block found; nothing to repair')
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m '[skip ci] Repair scheduler backend [scheduler-backend-fixed]'
          git push origin main
