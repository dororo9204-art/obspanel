name: TVPlayout 13 Scheduler UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch backend and load UI assets
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')

          old = 'from fastapi.responses import HTMLResponse, RedirectResponse, JSONResponse'
          new = 'from fastapi.responses import HTMLResponse, RedirectResponse, JSONResponse, FileResponse'
          if old in text and 'FileResponse' not in text:
              text = text.replace(old, new, 1)

          mount = 'app.mount("/static",StaticFiles(directory=str(BASE/"static")),name="static")'
          extra_mount = '''\napp.mount("/tmdb-cache",StaticFiles(directory=str(BASE/"cache"/"tmdb")),name="tmdb-cache")'''
          if 'name="tmdb-cache"' not in text:
              if mount not in text:
                  raise SystemExit('static mount marker not found')
              text = text.replace(mount, mount + extra_mount, 1)

          marker = '@app.get("/api/media/{mid}")'
          if '/api/tmdb/search' not in text:
              block = r'''\n\n@app.get("/api/tmdb/search")\nasync def tmdb_search_api(q:str=""):\n    q=str(q or "").strip()\n    if not q:\n        return {"results":[]}\n    try:\n        data=tmdb_api("/search/movie", {"query":q,"region":tmdb_config().get("region","MX"),"include_adult":"false"})\n        return {"results":(data.get("results") or [])[:20]}\n    except Exception as e:\n        return JSONResponse({"ok":False,"error":str(e)},500)\n\n@app.get("/api/tmdb/schedule-assets")\nasync def tmdb_schedule_assets(ids:str=""):\n    vals=[]\n    for x in str(ids or "").split(","):\n        try: vals.append(int(x))\n        except Exception: pass\n    if not vals:\n        return {"items":[]}\n    marks=",".join("?" for _ in vals)\n    c=db()\n    rows=c.execute(f"""SELECT s.id AS schedule_id,s.media_id,t.tmdb_id,t.tmdb_title,t.poster_local,t.logo_local,t.backdrop_local\n                       FROM schedule s LEFT JOIN tmdb_cache t ON t.media_id=s.media_id\n                       WHERE s.id IN ({marks})""", tuple(vals)).fetchall()\n    c.close()\n    out=[]\n    for r in rows:\n        d=dict(r)\n        d["poster_url"]=("/tmdb-cache/posters/"+Path(r["poster_local"]).name) if r["poster_local"] else ""\n        d["logo_url"]=("/tmdb-cache/logos/"+Path(r["logo_local"]).name) if r["logo_local"] else ""\n        d["backdrop_url"]=("/tmdb-cache/backdrops/"+Path(r["backdrop_local"]).name) if r["backdrop_local"] else ""\n        out.append(d)\n    return {"items":out}\n\n@app.post("/api/tmdb/select")\nasync def tmdb_select_api(request:Request):\n    data=await request.json()\n    schedule_id=int(data.get("schedule_id",0)); tid=int(data.get("tmdb_id",0))\n    if not schedule_id or not tid:\n        return JSONResponse({"ok":False,"error":"Faltan schedule_id o tmdb_id"},400)\n    c=db(); row=c.execute("SELECT media_id FROM schedule WHERE id=?",(schedule_id,)).fetchone(); c.close()\n    if not row:\n        return JSONResponse({"ok":False,"error":"Evento no encontrado"},404)\n    media_id=int(row["media_id"])\n    try:\n        movie=tmdb_api(f"/movie/{tid}",{})\n        root=BASE/"cache"/"tmdb"\n        posters=root/"posters"; logos=root/"logos"; backdrops=root/"backdrops"; metadata=root/"metadata"\n        for d in (posters,logos,backdrops,metadata): d.mkdir(parents=True,exist_ok=True)\n        sid=str(tid)\n        poster_local=tmdb_image_download(movie.get("poster_path"),posters/(sid+".jpg"),"w500") if movie.get("poster_path") else ""\n        backdrop_local=tmdb_image_download(movie.get("backdrop_path"),backdrops/(sid+".jpg"),"w1280") if movie.get("backdrop_path") else ""\n        logo_path=""; logo_local=""\n        try:\n            ims=tmdb_api(f"/movie/{tid}/images",{"include_image_language":"es,en,null"})\n            ls=ims.get("logos") or []\n            if ls:\n                logo_path=ls[0].get("file_path") or ""\n                if logo_path: logo_local=tmdb_image_download(logo_path,logos/(sid+".png"),"w500")\n        except Exception: pass\n        rd=str(movie.get("release_date") or "")\n        year=int(rd[:4]) if rd[:4].isdigit() else None\n        now=datetime.now().isoformat(timespec="seconds")\n        c=db(); c.execute("""INSERT INTO tmdb_cache(media_id,tmdb_id,tmdb_title,tmdb_original_title,tmdb_year,poster_path,poster_local,logo_path,logo_local,backdrop_path,backdrop_local,status,error,updated_at)\n          VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?)\n          ON CONFLICT(media_id) DO UPDATE SET tmdb_id=excluded.tmdb_id,tmdb_title=excluded.tmdb_title,tmdb_original_title=excluded.tmdb_original_title,tmdb_year=excluded.tmdb_year,poster_path=excluded.poster_path,poster_local=excluded.poster_local,logo_path=excluded.logo_path,logo_local=excluded.logo_local,backdrop_path=excluded.backdrop_path,backdrop_local=excluded.backdrop_local,status='found',error='',updated_at=excluded.updated_at""",\n          (media_id,tid,movie.get("title") or "",movie.get("original_title") or "",year,movie.get("poster_path") or "",poster_local,logo_path,logo_local,movie.get("backdrop_path") or "",backdrop_local,"found","",now))\n        c.commit(); c.close()\n        meta={"media_id":media_id,"tmdb_id":tid,"title":movie.get("title") or "","original_title":movie.get("original_title") or "","year":year,"poster_local":poster_local,"logo_local":logo_local,"backdrop_local":backdrop_local,"updated_at":now}\n        (metadata/(str(media_id)+".json")).write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding="utf-8")\n        return {"ok":True,"tmdb_id":tid,"title":movie.get("title") or "","poster_url":("/tmdb-cache/posters/"+Path(poster_local).name) if poster_local else ""}\n    except Exception as e:\n        return JSONResponse({"ok":False,"error":str(e)},500)\n'''
              if marker not in text:
                  raise SystemExit('media endpoint marker not found')
              text = text.replace(marker, block + '\n' + marker, 1)

          app.write_text(text, encoding='utf-8')

          index = Path('templates/index.html')
          html = index.read_text(encoding='utf-8')
          css_marker = '<link rel="stylesheet" href="/static/style.css"></head>'
          css_new = '<link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/scheduler_pro.css"></head>'
          if '/static/scheduler_pro.css' not in html:
              if css_marker not in html: raise SystemExit('index css marker not found')
              html = html.replace(css_marker, css_new, 1)
          if '/static/scheduler_pro.js' not in html:
              html = html.replace('</body>', '<script src="/static/scheduler_pro.js"></script></body>', 1)
          index.write_text(html, encoding='utf-8')

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "TVPlayout Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.py templates/index.html
          if git diff --cached --quiet; then
            echo "No backend/UI patch needed"
            exit 0
          fi
          git commit -m "[skip ci] Upgrade scheduler posters and NEXT editor"
          git push origin main
